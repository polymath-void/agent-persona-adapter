<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APA Cockpit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">APA<span class="brand-sub">cockpit</span></div>
  <nav class="nav">
    <a href="#/" data-route="/">Cockpit</a>
    <a href="#/personas" data-route="/personas">Personas</a>
    <a href="#/registrations" data-route="/registrations">Registrations</a>
    <a href="#/audit" data-route="/audit">Audit</a>
    <a href="#/editor" data-route="/editor">Editor</a>
  </nav>
  <div class="modebox">
    <span id="mode-badge" class="badge badge-mode">detecting…</span>
    <span id="hud" class="hud"></span>
  </div>
</header>

<main id="view" class="view"></main>

<footer class="footbar">
  <span id="foot-cli" class="mono">apa.py status</span>
  <span id="foot-drop" class="dropzone" title="Drop a snapshot.json to re-sync (serverless mode)">⤓ drop snapshot to re-sync</span>
</footer>

<input type="file" id="import-file" accept=".apa,application/gzip" hidden>
<script src="public/snapshot.js" onerror="window.APA_DATA_MISSING=true"></script>
<script src="app.js"></script>
</body>
</html>
